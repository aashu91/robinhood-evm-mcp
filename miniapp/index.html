<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Robin MCP Mini-App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; color: var(--accent); }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .tab { flex: 1; padding: 12px; background: var(--card); border: none; border-radius: 8px; color: var(--muted); cursor: pointer; white-space: nowrap; font-weight: 600; transition: all 0.2s; }
    .tab.active { background: var(--accent); color: #000; }
    .panel { display: none; animation: fadeIn 0.3s ease; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 0.9rem; }
    input { width: 100%; padding: 14px; background: var(--card); border: 1px solid #334155; border-radius: 8px; color: var(--text); font-size: 1rem; outline: none; }
    input:focus { border-color: var(--accent); }
    button.primary { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 8px; color: #000; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 8px; }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .stat-card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 12px; }
    .stat-label { color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 12px 24px; border-radius: 20px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
    .toast.show { opacity: 1; }
    .toast.error { background: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🐦 Robin MCP</h1>
    <p style="color:var(--muted);font-size:0.9rem;">Meme Coins • Trusts • Reserves</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showPanel('launch')">🚀 Launch</button>
    <button class="tab" onclick="showPanel('trust')">🤝 Trust</button>
    <button class="tab" onclick="showPanel('reserves')">🏦 Reserves</button>
  </div>

  <!-- Launch Panel -->
  <div id="launch" class="panel active">
    <div class="form-group">
      <label>Token Name</label>
      <input type="text" id="tokenName" placeholder="e.g., DogeRocket">
    </div>
    <div class="form-group">
      <label>Symbol</label>
      <input type="text" id="tokenSymbol" placeholder="e.g., DGRKT" maxlength="10">
    </div>
    <div class="form-group">
      <label>Initial Supply</label>
      <input type="number" id="tokenSupply" placeholder="1000000" min="1">
    </div>
    <button class="primary" id="launchBtn" onclick="launchToken()">Launch Token</button>
  </div>

  <!-- Trust Panel -->
  <div id="trust" class="panel">
    <div class="form-group">
      <label>Beneficiary Address</label>
      <input type="text" id="trustBeneficiary" placeholder="0x...">
    </div>
    <div class="form-group">
      <label>Vault Amount</label>
      <input type="number" id="trustAmount" placeholder="5000" min="1">
    </div>
    <button class="primary" id="trustBtn" onclick="deployTrust()">Deploy Trust</button>
  </div>

  <!-- Reserves Panel -->
  <div id="reserves" class="panel">
    <div class="stat-card">
      <div class="stat-label">Gold Reserves</div>
      <div class="stat-value" id="goldVal">Loading...</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Silver Reserves</div>
      <div class="stat-value" id="silverVal">Loading...</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Last Updated</div>
      <div class="stat-value" style="font-size:1rem;color:var(--muted)" id="tsVal">-</div>
    </div>
    <button class="primary" onclick="loadReserves()" style="margin-top:12px;background:#334155;color:var(--text)">Refresh</button>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Backend proxy endpoint (set via env or default to local dev)
    const API_BASE = tg.initDataUnsafe?.start_param || window.location.origin;
    const MCP_ENDPOINT = `${API_BASE}/mcp`;

    function showPanel(id) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
      if (id === 'reserves') loadReserves();
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast show ${isError ? 'error' : ''}`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function callMCP(method, params) {
      const res = await fetch(MCP_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ method, params })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function launchToken() {
      const btn = document.getElementById('launchBtn');
      const name = document.getElementById('tokenName').value.trim();
      const symbol = document.getElementById('tokenSymbol').value.trim().toUpperCase();
      const supply = parseInt(document.getElementById('tokenSupply').value);

      if (!name || !symbol || !supply) return showToast('Fill all fields', true);

      btn.disabled = true;
      btn.textContent = 'Launching...';
      try {
        const r = await callMCP('launch_token', { name, symbol, initial_supply: supply });
        if (r.success) {
          showToast(`✅ ${symbol} launched at ${r.address.slice(0,8)}...`);
          tg.sendData(JSON.stringify({ type: 'launched', address: r.address }));
        } else {
          showToast(r.error || 'Launch failed', true);
        }
      } catch (e) {
        showToast(`Error: ${e.message}`, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Launch Token';
      }
    }

    async function deployTrust() {
      const btn = document.getElementById('trustBtn');
      const beneficiary = document.getElementById('trustBeneficiary').value.trim();
      const amount = parseInt(document.getElementById('trustAmount').value);

      if (!beneficiary || !amount) return showToast('Fill all fields', true);
      if (!/^0x[a-fA-F0-9]{40}$/.test(beneficiary)) return showToast('Invalid address', true);

      btn.disabled = true;
      btn.textContent = 'Deploying...';
      try {
        const r = await callMCP('deploy_trust', { beneficiary, vault_amount: amount });
        if (r.success) {
          showToast(`✅ Trust deployed: ${r.trust_address.slice(0,8)}...`);
          tg.sendData(JSON.stringify({ type: 'trust_deployed', address: r.trust_address }));
        } else {
          showToast(r.error || 'Deployment failed', true);
        }
      } catch (e) {
        showToast(`Error: ${e.message}`, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Deploy Trust';
      }
    }

    async function loadReserves() {
      try {
        const r = await callMCP('get_reserves', {});
        document.getElementById('goldVal').textContent = `${Number(r.gold).toLocaleString()} oz`;
        document.getElementById('silverVal').textContent = `${Number(r.silver).toLocaleString()} oz`;
        document.getElementById('tsVal').textContent = r.timestamp || 'N/A';
      } catch (e) {
        document.getElementById('goldVal').textContent = 'Error';
        document.getElementById('silverVal').textContent = 'Error';
        showToast('Failed to load reserves', true);
      }
    }

    // Auto-load reserves on tab switch handled in showPanel
    tg.ready();
  </script>
</body>
</html>
