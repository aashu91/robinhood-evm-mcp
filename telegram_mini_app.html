<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robinhood EVM MCP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0B0E11; --panel:#151A21; --panel2:#1B222C;
    --gold:#F0B90B; --green:#16C784; --red:#EA3943;
    --text:#EAECEF; --muted:#848E9C; --border:#2B3139;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:16px 16px 96px;
  }
  header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .logo{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--gold),#c98a00);
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  header h1{font-size:18px;font-weight:700}
  header p{font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 14px; text-align:left; cursor:pointer; transition:transform .08s ease, border-color .2s;
    color:var(--text);
  }
  .card:active{transform:scale(.97)}
  .card .ico{font-size:22px;margin-bottom:8px;display:block}
  .card b{display:block;font-size:14px;margin-bottom:2px}
  .card span{font-size:11px;color:var(--muted);line-height:1.3;display:block}
  .card:hover{border-color:var(--gold)}
  .status{
    background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; min-height:120px;
  }
  .status h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  #output{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; line-height:1.5;
    white-space:pre-wrap; word-break:break-word; color:var(--text);
  }
  #output.ok{color:var(--green)}
  #output.err{color:var(--red)}
  #output.idle{color:var(--muted)}
  .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid var(--border);
    border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:-2px;margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="logo">🏹</div>
  <div>
    <h1>Robinhood EVM MCP</h1>
    <p>Launch meme-coins &amp; track trusts</p>
  </div>
</header>

<div class="grid">
  <button class="card" onclick="run('launch')">
    <span class="ico">🚀</span><b>Launch Token</b><span>Deploy a new meme-coin</span>
  </button>
  <button class="card" onclick="run('trust')">
    <span class="ico">🛡️</span><b>Deploy Trust</b><span>Create a community trust</span>
  </button>
  <button class="card" onclick="run('reserves')">
    <span class="ico">💰</span><b>Reserves</b><span>Gold / silver stats</span>
  </button>
  <button class="card" onclick="run('portfolio')">
    <span class="ico">📊</span><b>Portfolio</b><span>Your holdings</span>
  </button>
</div>

<section class="status">
  <h2>Result</h2>
  <div id="output" class="idle">Tap an action above to call the MCP server.</div>
</section>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); tg.setHeaderColor('#0B0E11'); tg.setBackgroundColor('#0B0E11'); } catch (e) {}
  }
  const out = document.getElementById('output');

  async function run(action) {
    out.className = 'idle';
    out.innerHTML = '<span class="spinner"></span>Calling ' + action + '…';
    try {
      const res = await fetch('/api/' + action, { method: 'GET' });
      const data = await res.json();
      out.className = data.ok ? 'ok' : 'err';
      out.textContent = data.result || '(empty response)';
      if (tg && tg.HapticFeedback) {
        try { tg.HapticFeedback.notificationOccurred(data.ok ? 'success' : 'error'); } catch (e) {}
      }
    } catch (err) {
      out.className = 'err';
      out.textContent = 'Network error: ' + err.message;
    }
  }
</script>
</body>
</html>
